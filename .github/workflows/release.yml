name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          OUTPUT=$(npx semantic-release 2>&1)
          echo "$OUTPUT"
          # Check if a new tag was created
          if echo "$OUTPUT" | grep -q "Created tag"; then
            TAG=$(echo "$OUTPUT" | grep "Created tag" | sed 's/.*Created tag //')
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Docker Build
        if: steps.semantic.outputs.released == 'true'
        run: |
          VERSION="${{ steps.semantic.outputs.tag }}"
          echo "Triggering Docker Build for $VERSION"
          gh workflow run build.yml -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old GitHub Releases (keep 10)
        if: steps.semantic.outputs.released == 'true'
        run: |
          # List releases by published date (newest first), skip the first 10, delete the rest
          gh release list --json tagName,publishedAt --jq 'sort_by(.publishedAt) | reverse | .[].tagName' --limit 100 | tail -n +11 | while read tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes 2>/dev/null || true
            git push --delete origin "$tag" 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}